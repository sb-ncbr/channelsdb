events {
    worker_connections 1024;
}

http {
    include mime.types;
    server {
       listen 80;
       root /var/www/;

       gzip on;
       gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;

       absolute_redirect off;

       rewrite  /detail/(.*)  /detail/$1 last;

       location /api {
            proxy_pass http://api:8000/;
            rewrite  ^/api/(.*)  /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            # Overwrite any client-supplied value, nginx is the only proxy
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header "Access-Control-Allow-Origin" "*";
       }

       location ~* "/detail/pdb/[0-9][a-z0-9]{3}" {
            rewrite  ^/detail/pdb/(.*)$ /detail?pid=$1&subDB=pdb;
       }

       location ~* "/detail/alphafill/(.*)" {
            rewrite  ^/detail/alphafill/(.*)$ /detail?pid=$1&subDB=alphafill;
       }

       # Asset names contain a hash of their content, so a name always refers to the same content
       location ~ "^/detail/.+\.[0-9a-f]{8}\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
       }

       # Always revalidate the page, so that it refers to the assets of the current version
       location = /detail/index.html {
            add_header Cache-Control "no-cache";
       }
    }
}
