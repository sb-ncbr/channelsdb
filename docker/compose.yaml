name: channelsdb

services:
  api:
    build: ../api
    container_name: api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /api --proxy-headers --forwarded-allow-ips '*' --workers 8
    volumes:
      - ${CHANNELSDB_DATA:-/data}:/data:ro
    logging:
      driver: journald
      options:
        tag: channelsdb-api

  web:
    container_name: web
    build:
      context: ..
      dockerfile: ./docker/web.Dockerfile
    command: ["nginx", "-c", "/etc/nginx/channelsdb/devel.conf", "-g", "daemon off;"]
    volumes:
      # The directory, so that changed files are seen (a mounted file stays the one replaced by git)
      - ./nginx:/etc/nginx/channelsdb:ro,z
    depends_on:
      - api
    ports:
      - "${CHANNELSDB_PORT:-80}:80"
    logging:
      driver: journald
      options:
        tag: channelsdb-web
