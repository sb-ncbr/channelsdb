events {
    worker_connections 1024;
}
http {
    include mime.types;

    # All names over plain HTTP
    server {
        listen 80 default_server;

        # Let's Encrypt challenges, written there by certbot on the host
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://channelsdb2.biodata.ceitec.cz$request_uri;
        }
    }

    server {
        server_name channelsdb.ncbr.muni.cz;
        listen 443 ssl;

        ssl_certificate /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/privkey.pem;
        ssl_protocols TLSv1.3;

        return 301 https://channelsdb2.biodata.ceitec.cz$request_uri;
    }

    server {

       server_name channelsdb2.biodata.ceitec.cz;
       listen 443 ssl;

       http2 on;

       gzip on;
       gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;

       ssl_certificate /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/privkey.pem;
       ssl_protocols TLSv1.3;

       root /var/www/;

       absolute_redirect off;

       rewrite  /detail/(.*)  /detail/$1 last;

       location /api {
             if ($request_method = "OPTIONS") {
                add_header "Access-Control-Allow-Origin" "*" always;
                add_header "Access-Control-Allow-Methods" "GET, OPTIONS" always;
                add_header "Access-Control-Allow-Headers" "Content-Type" always;
                add_header "Content-Length" 0;
                add_header "Content-Type" "text/plain";
                return 204;
            }

            add_header "Access-Control-Allow-Origin" "*" always;
            add_header "Access-Control-Allow-Methods" "GET, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Content-Type" always;

            proxy_pass http://api:8000/;
            rewrite  ^/api/(.*)  /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            # Overwrite any client-supplied value, nginx is the only proxy
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
       }

       location ~* "/detail/pdb/[0-9][a-z0-9]{3}" {
            rewrite  ^/detail/pdb/(.*)$ /detail?pid=$1&subDB=pdb;
       }

       location ~* "/detail/alphafill/(.*)" {
            rewrite  ^/detail/alphafill/(.*)$ /detail?pid=$1&subDB=alphafill;
       }

       # Asset names contain a hash of their content, so a name always refers to the same content
       location ~ "\.[0-9a-f]{8}\.(js|css|woff2?|ttf|eot|svg)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
       }

       # Always revalidate the pages, so that they refer to the assets of the current version
       location ~ "\.html$" {
            add_header Cache-Control "no-cache";
       }
    }
}
