# Serves the frontends built locally (npm run build in /frontend and /results) instead of the ones in the image,
# so changes can be tested without rebuilding the image:
#   docker compose -f docker/docker-compose.yaml -f docker/docker-compose.local-dist.yaml up
name: channelsdb

services:
  web:
    volumes:
      - ../frontend/dist:/var/www:ro,z
      - ../results/dist:/var/www/detail:ro,z
