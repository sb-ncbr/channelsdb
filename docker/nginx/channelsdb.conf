# The site, included in the server of devel.conf and production.conf

root /var/www;

# Redirects (e.g. /detail -> /detail/) keep the client's host, port and scheme
absolute_redirect off;

gzip on;
gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;

# The API without its /api prefix; it handles CORS itself
location /api/ {
    proxy_pass http://api:8000/;
    # The API's redirects (e.g. without a trailing slash) include /api already
    proxy_redirect ~^https?://api:8000/api/(.*)$ /api/$1;
    # Overwrite any client-supplied value, nginx is the only proxy
    proxy_set_header X-Forwarded-For $remote_addr;
}

# The MCP server for assistants, at the conventional /mcp of the site (in the API at /mcp too)
location = /mcp {
    proxy_pass http://api:8000/mcp;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Results page: /detail/pdb/1ymg -> /detail/?pid=1ymg&subDB=pdb
location ~ ^/detail/(pdb|alphafill)/([^/]+)$ {
    return 301 /detail/?pid=$2&subDB=$1;
}

# Asset names contain a hash of their content, so a name always refers to the same content
location ~ "\.[0-9a-f]{8}\.(js|css|woff2?|ttf|eot|svg)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Always revalidate the pages, so that they refer to the assets of the current version
location ~ "\.html$" {
    add_header Cache-Control "no-cache";
}
