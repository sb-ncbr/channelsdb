events {}

http {
    include /etc/nginx/mime.types;

    # Headers added in a location are added to those of the server, instead of replacing them
    add_header_inherit merge;

    # One certificate for both names
    ssl_certificate /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/channelsdb.ncbr.muni.cz/privkey.pem;
    ssl_protocols TLSv1.3;

    # Browsers use only HTTPS for these names from now on (not for their subdomains, which are not ours)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # All names over plain HTTP
    server {
        listen 80 default_server;

        # Let's Encrypt challenges, written there by certbot on the host
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://channelsdb2.biodata.ceitec.cz$request_uri;
        }
    }

    # The old name
    server {
        listen 443 ssl;
        server_name channelsdb.ncbr.muni.cz;
        return 301 https://channelsdb2.biodata.ceitec.cz$request_uri;
    }

    server {
        listen 443 ssl;
        server_name channelsdb2.biodata.ceitec.cz;
        http2 on;
        include /etc/nginx/channelsdb/channelsdb.conf;
    }
}
