name: channelsdb

services:
  api:
    volumes:
      - /data:/data:ro
    restart: always

  web:
    command: ["nginx", "-c", "/etc/nginx/channelsdb/production.conf", "-g", "daemon off;"]
    volumes:
      # Whole directories, so that reloading nginx picks up renewed certificates
      # (live/ only links to the current files in archive/)
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always
