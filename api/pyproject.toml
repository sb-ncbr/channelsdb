[project]
name = "channelsdb-api"
version = "1.0.0"
description = "ChannelsDB 2.0 API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
