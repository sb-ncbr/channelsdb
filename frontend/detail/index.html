<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="utf-8" />
	<link rel="icon" type="image/png" href="/favicon.png" />

	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=1" />
	<title>ChannelsDB 2.0 | Detail</title>

</head>

<body>
    <div id="controls"></div>
	<div class="chdb-panel plugin" id="plugin"></div>
	<div class="chdb-panel bottom-panel">
		<div class="left-tabs">
			<div id="left-tabs">
				<ul class="nav nav-tabs">
					<li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#left-tabs-1">Channel profile</a></li>
					<li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#left-tabs-2">Channels properties</a></li>
					<li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#left-tabs-3">Channels descriptions</a></li>
				</ul>
				<div class="tab-content">
					<div id="left-tabs-1" class="tab-pane fade show active">
						<div class="layerVizualizer" id="layer-vizualizer-ui"></div>
					</div>
					<div id="left-tabs-2" class="tab-pane fade">
						<div class="aglomered-parameters" id="aglomered-parameters-ui"></div>
					</div>
					<div id="left-tabs-3" class="tab-pane fade">
						<div class="channels-descriptions" id="channels-descriptions-ui"></div>
					</div>
				</div>
			</div>
			<div id="bottom-tabs-toggler" class="toggler bi bi-arrows"></div>
		</div>
		<div class="right-tabs">
			<div id="right-tabs">
				<ul class="nav nav-tabs">
					<li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#right-tabs-1">Layer</a></li>
					<li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#right-tabs-2">Lining residues</a></li>
					<li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#right-tabs-3">Residue annotations</a></li>
				</ul>
				<div class="tab-content">
					<div id="right-tabs-1" class="tab-pane fade show active">
						<div id="layer-residues">
						</div>
						<div id="layer-properties">
						</div>
					</div>
					<div id="right-tabs-2" class="tab-pane fade">
					</div>
					<div id="right-tabs-3" class="tab-pane fade">
					</div>
				</div>
			</div>
		</div>
		<div id="bottom-panel-toggler" class="toggler bi bi-arrows-vertical"></div>
	</div>
	<div class="chdb-panel right-panel">
		<div id="ui" class="ui toggled">
			<button id="process">Process</button>
		</div>
		<div class="bottom toggled">
			<div id="right-panel-tabs">
				<ul class="nav nav-tabs">
					<li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#right-panel-tabs-1">Protein annotations</a></li>
				</ul>
				<div class="tab-content">
					<div id="right-panel-tabs-1" class="tab-pane fade show active">
					</div>
				</div>
			</div>
			<div id="right-panel-toggler" class="toggler bi bi-arrows-vertical"></div>
		</div>
	</div>
  	<script type="module" src="./src/main.ts"></script>
</body>
</html>
